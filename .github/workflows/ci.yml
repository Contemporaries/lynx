name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
      - name: Test
        run: |
          go test ./...
          go vet ./...
      - name: Build matrix smoke
        run: |
          CGO_ENABLED=0 go build -o /tmp/lynx-server ./cmd/lynx-server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/lynx-client.exe ./cmd/lynx-client
